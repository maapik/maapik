<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="maapik — DFIR, Reverse Engineering, CTF">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0c1425"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.38"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="900" height="230" rx="14"/>
    </clipPath>
  </defs>
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseStatus {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes hexBreath {
      0%, 100% { opacity: 0.24; }
      50% { opacity: 0.42; }
    }
    .cursor { animation: blink 1.1s step-end infinite; }
    .status-dot { animation: pulseStatus 2.6s ease-in-out infinite; }
    .hex-col { animation: hexBreath 4.5s ease-in-out infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>
  <g clip-path="url(#cardClip)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <rect width="900" height="230" fill="url(#grid)"/>
    <rect width="900" height="230" fill="url(#glow)"/>
    <rect x="0" y="0" width="900" height="3" fill="url(#accent)"/>

    <!-- Terminal title bar -->
    <rect x="0" y="3" width="900" height="30" fill="#0b1120" fill-opacity="0.8"/>
    <line x1="0" y1="33" x2="900" y2="33" stroke="#1e293b" stroke-width="1"/>
    <circle cx="24" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="43" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="18" r="5.5" fill="#27c93f"/>
    <text x="84" y="22" class="mono" font-size="12" fill="#64748b">maapik@forensics:~/portfolio — zsh</text>

    <!-- Left main identity -->
    <text x="36" y="72" class="mono" font-size="13" fill="#00f5d4">$ whoami</text>
    <text x="36" y="124" class="mono" font-size="46" font-weight="700" fill="#f8fafc">maapik<tspan class="cursor" fill="#00f5d4">_</tspan></text>
    <text x="36" y="159" class="mono" font-size="17" font-weight="700" fill="#38bdf8">DFIR  •  Reverse Engineering  •  CTF</text>

    <!-- Status line -->
    <circle cx="42" cy="195" r="4.5" fill="#10b981" class="status-dot"/>
    <text x="56" y="199" class="mono" font-size="12" fill="#94a3b8">ONLINE // RTU MIREA InfoSec • Incident Response &amp; Binary Analysis</text>

    <!-- Right side authentic forensics hex dump -->
    <line x1="590" y1="50" x2="590" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4"/>
    <g class="hex-col">
      <text x="615" y="72" class="mono" font-size="11.5" fill="#38bdf8">0x0000: 4D 5A 90 00  |MZ..|</text>
      <text x="615" y="96" class="mono" font-size="11.5" fill="#00f5d4">0x0010: 24 4D 46 54  |$MFT|</text>
      <text x="615" y="120" class="mono" font-size="11.5" fill="#38bdf8">0x0020: 45 6C 66 46  |EVTX|</text>
      <text x="615" y="144" class="mono" font-size="11.5" fill="#818cf8">0x0030: 7F 45 4C 46  |.ELF|</text>
      <text x="615" y="168" class="mono" font-size="11.5" fill="#38bdf8">0x0040: 49 44 41 20  |IDA.|</text>
      <text x="615" y="192" class="mono" font-size="11.5" fill="#00f5d4">0x0050: 44 46 49 52  |DFIR|</text>
    </g>

    <rect x="0.5" y="0.5" width="899" height="229" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
