<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="maapik — DFIR, Reverse Engineering, CTF">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0c"/>
      <stop offset="55%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#272a30"/>
      <stop offset="25%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="75%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#272a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="52%" r="44%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="60%" stop-color="#9ca3af" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2228" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="scanlines" width="900" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="900" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.025"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="900" height="230" rx="14"/>
    </clipPath>
  </defs>
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseStatus {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes hexBreath {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    .cursor { animation: blink 1.1s step-end infinite; }
    .status-dot { animation: pulseStatus 2.6s ease-in-out infinite; }
    .hex-col { animation: hexBreath 4.5s ease-in-out infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  </style>
  <g clip-path="url(#cardClip)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <rect width="900" height="230" fill="url(#grid)"/>
    <rect width="900" height="230" fill="url(#scanlines)"/>
    <rect width="900" height="230" fill="url(#glow)"/>
    <rect x="0" y="0" width="900" height="2" fill="url(#steel)"/>

    <!-- Terminal title bar -->
    <rect x="0" y="2" width="900" height="30" fill="#0d0e12" fill-opacity="0.85"/>
    <line x1="0" y1="32" x2="900" y2="32" stroke="#272a30" stroke-width="1"/>
    <circle cx="24" cy="17" r="5" fill="#3f434d"/>
    <circle cx="42" cy="17" r="5" fill="#525763"/>
    <circle cx="60" cy="17" r="5" fill="#6b7280"/>
    <text x="82" y="21" class="mono" font-size="11.5" fill="#71717a">maapik@forensics:~/cases — tty1</text>

    <!-- Left main identity -->
    <text x="36" y="72" class="mono" font-size="13" fill="#71717a">$ whoami</text>
    <text x="36" y="124" class="mono" font-size="46" font-weight="700" fill="#f4f4f5">maapik<tspan class="cursor" fill="#d4d4d8">_</tspan></text>
    <text x="36" y="159" class="mono" font-size="16" font-weight="700" fill="#a1a1aa">DFIR  //  REVERSE ENGINEERING  //  CTF</text>

    <!-- Status line -->
    <circle cx="42" cy="195" r="4" fill="#dc2626" class="status-dot"/>
    <text x="56" y="199" class="mono" font-size="11.5" fill="#71717a">ONLINE // RTU MIREA INFOSEC • DIGITAL FORENSICS &amp; BINARY ANALYSIS</text>

    <!-- Right side monochrome forensics hex dump -->
    <line x1="590" y1="50" x2="590" y2="210" stroke="#272a30" stroke-width="1" stroke-dasharray="3 4"/>
    <g class="hex-col">
      <text x="615" y="72" class="mono" font-size="11.5" fill="#71717a">0x0000: 4D 5A 90 00  |MZ..|</text>
      <text x="615" y="96" class="mono" font-size="11.5" fill="#a1a1aa">0x0010: 24 4D 46 54  |$MFT|</text>
      <text x="615" y="120" class="mono" font-size="11.5" fill="#71717a">0x0020: 45 6C 66 46  |EVTX|</text>
      <text x="615" y="144" class="mono" font-size="11.5" fill="#52525b">0x0030: 7F 45 4C 46  |.ELF|</text>
      <text x="615" y="168" class="mono" font-size="11.5" fill="#71717a">0x0040: 49 44 41 20  |IDA.|</text>
      <text x="615" y="192" class="mono" font-size="11.5" fill="#a1a1aa">0x0050: 44 46 49 52  |DFIR|</text>
    </g>

    <rect x="0.5" y="0.5" width="899" height="229" rx="14" fill="none" stroke="#272a30" stroke-width="1"/>
  </g>
</svg>
